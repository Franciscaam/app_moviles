<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="app-title">DestinApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item class="input-item">
          <ion-label position="stacked">Correo Electrónico</ion-label>
          <ion-input [(ngModel)]="usuario" type="email" placeholder="Ingresa tu correo"></ion-input>
        </ion-item>

        <ion-item class="input-item">
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input [(ngModel)]="pass" type="password" placeholder="Ingresa tu contraseña"></ion-input>
        </ion-item>

        <ion-button expand="block" color="primary" (click)="ingresar()">Iniciar sesión</ion-button>

        <ion-button expand="block" color="secondary" (click)="registrarse()">¿No tienes cuenta? Regístrate</ion-button>

        <ion-button expand="block" color="medium" (click)="olvidoContrasena()">Olvidé mi contraseña</ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
